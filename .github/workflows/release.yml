name: Release

# 仅在推送 v* tag 时触发（即 ./deploy.sh release 定版之后），
# 普通 push / PR 不会触发本工作流。
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=moderate
      - name: macOS 签名与公证构建
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: 5MWQ45Z9F7
        run: npm run build:mac -- --config.forceCodeSigning=true --config.mac.notarize=true
      - name: 校验 macOS 公证票据
        if: runner.os == 'macOS'
        run: xcrun stapler validate builds/mac-arm64/zTerm.app
      - name: Windows 签名构建
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          ZTERM_UPDATE_WIN_PUBLISHER: ${{ vars.ZTERM_UPDATE_WIN_PUBLISHER }}
        shell: pwsh
        run: |
          if (-not $env:ZTERM_UPDATE_WIN_PUBLISHER) { throw '缺少受信任 Windows 发布者配置' }
          npm run build:win -- --config.forceCodeSigning=true
      - name: Linux 构建
        if: runner.os == 'Linux'
        run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: zterm-${{ matrix.os }}
          if-no-files-found: error
          path: |
            builds/*.dmg
            builds/*.exe
            builds/*.AppImage
            builds/*.deb
            builds/*.rpm

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true
      - name: 创建 GitHub Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(builds/*)
          if ((${#assets[@]} == 0)); then
            echo '没有找到任何安装包' >&2
            exit 1
          fi
          (cd builds && sha256sum * > SHA256SUMS)
          assets+=(builds/SHA256SUMS)
          gh release create "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            "${assets[@]}"
