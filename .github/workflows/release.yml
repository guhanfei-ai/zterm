name: Release

# 仅在推送 v* tag 时触发（即 ./deploy.sh release 定版之后），
# 普通 push / PR 不会触发本工作流。
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: zterm-${{ matrix.os }}
          if-no-files-found: error
          path: |
            builds/*.dmg
            builds/*.exe
            builds/*.AppImage
            builds/*.deb
            builds/*.rpm

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true
      - name: 创建 GitHub Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(builds/*)
          if ((${#assets[@]} == 0)); then
            echo '没有找到任何安装包' >&2
            exit 1
          fi
          gh release create "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            "${assets[@]}"
