name: CI

# 日常 push / PR 只做轻量验证（类型检查 + 测试），不打包安装包；
# 安装包打包与发布由 release.yml 在推送 v* tag 后触发。
on:
  push:
    branches: [main, dev, '**']
  pull_request:
    branches: [main, dev, '**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
