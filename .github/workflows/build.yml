name: CI

# 日常 push / PR 验证类型、测试、生产依赖和代码构建，不打包安装包；
# 安装包打包与发布由 release.yml 在推送 v* tag 后触发。
on:
  push:
    branches: [main, dev, '**']
  pull_request:
    branches: [main, dev, '**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
